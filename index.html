<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Study Lantern</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f8f6ef; color: #202d28; font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 780px; margin: 8vh auto; padding: 0 24px 60px; }
    .eyebrow { color: #31725b; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; font-size: .75rem; }
    h1 { font-size: clamp(2.5rem, 7vw, 4rem); line-height: 1.05; margin: 12px 0; }
    p { color: #52665b; }
    label { display: block; font-weight: 700; margin: 30px 0 8px; }
    textarea { width: 100%; min-height: 220px; padding: 16px; border: 1px solid #b8c9bd; border-radius: 12px; font: inherit; resize: vertical; background: white; }
    button { margin-top: 14px; border: 0; border-radius: 9px; padding: 13px 20px; background: #215e48; color: white; font: inherit; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    #status { min-height: 1.5em; }
    #result { white-space: pre-wrap; overflow-wrap: anywhere; background: white; border: 1px solid #dce6dd; border-radius: 12px; padding: 24px; }
    #result:empty { display: none; }
  </style>
</head>
<body><main>
  <div class="eyebrow">Local AI for curious minds</div>
  <h1>Study Lantern</h1>
  <p>Turn your notes into a study guide and practice questions. Powered by Gemma 3 running on your computer.</p>
  <form id="form">
    <label for="notes">Your notes</label>
    <textarea id="notes" maxlength="12000" required placeholder="Paste your notes here..."></textarea>
    <button id="submit">Make my study guide</button>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
  <section id="result" aria-label="Study guide"></section>
</main>
<script>
  const form = document.querySelector('#form'), status = document.querySelector('#status');
  const button = document.querySelector('#submit'), result = document.querySelector('#result');
  form.addEventListener('submit', async (event) => {
    event.preventDefault(); button.disabled = true; result.textContent = '';
    status.textContent = 'Creating your guide locally. This can take a moment...';
    try {
      const response = await fetch('/api/study', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({notes: document.querySelector('#notes').value}) });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'Something went wrong.');
      result.textContent = data.result; status.textContent = 'Your study guide is ready. Check answers against your notes.';
    } catch (error) { status.textContent = error.message; }
    finally { button.disabled = false; }
  });
</script></body></html>
